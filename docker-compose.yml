services:
  rabbitmq:
    image: rabbitmq:4.1-management
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 10s
      retries: 20

  # The exchanges other services own, which the backend only checks.
  rabbitmq-exchanges:
    image: rabbitmq:4.1-management
    depends_on:
      rabbitmq:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        for exchange in space b2b admin-panel; do
          rabbitmqadmin --host rabbitmq --non-interactive declare exchange \
            --name "$$exchange" --type topic --durable true || exit 1
        done

  postgres:
    image: postgres:18
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: twake_space
      POSTGRES_PASSWORD: twake_space
      POSTGRES_DB: twake_space
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'twake_space']
      interval: 5s
      retries: 10

  backend:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      rabbitmq-exchanges:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
      DATABASE_URL: postgres://twake_space:twake_space@postgres:5432/twake_space
      LDAP_REST_URL: http://ldap-rest:8081
      LDAP_REST_SERVICE_ID: twake-space
      LDAP_REST_SECRET: local-development-secret-not-for-production
      OIDC_ISSUER: ${OIDC_ISSUER:-https://sign-up.twake.app/}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-local-development-secret}

  frontend:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    read_only: true
    tmpfs: [/tmp]
    ports:
      - '127.0.0.1:3000:8080'

volumes:
  postgres:
