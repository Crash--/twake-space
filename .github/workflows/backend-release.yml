name: Backend Release

on:
  push:
    tags:
      - 'backend-v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/verify-release-tag
        with:
          project: backend
          tag-prefix: backend-v
          package-json-path: apps/backend/package.json
          allowed-branches: main
      - id: version
        run: echo "version=${GITHUB_REF_NAME#backend-v}" >> "$GITHUB_OUTPUT"

  check:
    needs: [verify]
    uses: ./.github/workflows/reusable-check.yml
    with:
      project: backend

  publish:
    needs: [verify, check]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      project: backend
      push: true
      version: ${{ needs.verify.outputs.version }}

  release:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Generate release notes
        id: notes
        uses: ./.github/actions/generate-release-notes
        with:
          path: apps/backend
          workflow-prefix: backend
          tag-prefix: backend-v
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Backend ${{ needs.verify.outputs.version }}
          body_path: ${{ steps.notes.outputs.body-path }}
