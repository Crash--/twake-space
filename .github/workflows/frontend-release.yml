name: Frontend Release

on:
  push:
    tags:
      - 'frontend-v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/verify-release-tag
        with:
          project: frontend
          tag-prefix: frontend-v
          package-json-path: apps/frontend/package.json
          allowed-branches: main
      - id: version
        run: echo "version=${GITHUB_REF_NAME#frontend-v}" >> "$GITHUB_OUTPUT"

  check:
    needs: [verify]
    uses: ./.github/workflows/reusable-check.yml
    with:
      project: frontend

  publish:
    needs: [verify, check]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      project: frontend
      push: true
      version: ${{ needs.verify.outputs.version }}

  manifest:
    needs: [verify, check]
    uses: linagora/twake-workflows/.github/workflows/publish-manifest.yml@578530b3996920ec3459d1ef1f322ec8b9fed2b7 # v1.5.0
    with:
      tag-prefix: frontend-v
      package-json: apps/frontend/package.json
    secrets:
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      DOWNCLOUD_SSH_KEY: ${{ secrets.DOWNCLOUD_SSH_KEY }}

  release:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Generate release notes
        id: notes
        uses: ./.github/actions/generate-release-notes
        with:
          path: apps/frontend
          workflow-prefix: frontend
          tag-prefix: frontend-v
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Frontend ${{ needs.verify.outputs.version }}
          body_path: ${{ steps.notes.outputs.body-path }}
